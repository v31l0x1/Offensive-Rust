[package]
name = "dotnetLoader"
version = "0.1.0"
edition = "2024"

[dependencies]
clroxide = "1.1.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Antimalware",
] }


[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
